name: PR Policy Check

on:
  pull_request:
    paths:
      - 'terraform/**'
      - 'clusters/**'
      - 'policies/**'

jobs:
  policy-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write        # required for OIDC AWS auth

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Conditional: skipped gracefully if AWS_CI_ROLE_ARN is not yet configured.
      # Without credentials, terraform plan is skipped but checkov/OPA still run against source files.
      - name: Configure AWS credentials (OIDC)
        id: aws-auth
        if: ${{ secrets.AWS_CI_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Install checkov and OPA
        run: |
          pip install checkov
          curl -sL https://openpolicyagent.org/downloads/latest/opa_linux_amd64 -o /usr/local/bin/opa
          chmod +x /usr/local/bin/opa

      # Only runs if AWS credentials are available — terraform plan needs backend access.
      - name: Terraform init (all changed module directories)
        if: steps.aws-auth.outcome == 'success'
        run: |
          git diff --name-only origin/main...HEAD \
            | grep -E '\.tf$' \
            | sed 's|/[^/]*\.tf$||' \
            | sort -u \
            | while read -r dir; do
                echo "Init: $dir"
                terraform -chdir="$dir" init -backend=false -input=false
              done

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run policy check loop
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set if routing Claude through Azure AI Foundry instead of Anthropic API directly.
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        run: bash loops/pr-policy-check.sh
