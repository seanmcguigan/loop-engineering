apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    platform.io/team: platform
    app.kubernetes.io/managed-by: flux
    istio-injection: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    platform.io/team: platform
    app.kubernetes.io/managed-by: flux
    istio-injection: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: ingress
  labels:
    platform.io/team: platform
    app.kubernetes.io/managed-by: flux
    istio-injection: enabled
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
