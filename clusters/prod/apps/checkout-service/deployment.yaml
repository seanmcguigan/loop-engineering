apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
  namespace: platform
  labels:
    app.kubernetes.io/name: checkout-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/managed-by: flux
    platform.io/team: platform
    platform.io/cost-centre: CC-0001
    platform.io/env: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout-service
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: platform
        app.kubernetes.io/managed-by: flux
        platform.io/team: platform
        platform.io/cost-centre: CC-0001
        platform.io/env: prod
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      # Node-level spread: soft rule preferring pods land on different nodes within a zone.
      # Complements topologySpreadConstraints — zone spread alone allows both pods on the
      # same node inside one AZ, which a single node failure would take out simultaneously.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: checkout-service
                topologyKey: kubernetes.io/hostname
      # Zone-level spread: hard rule keeping pod count difference between AZs <= 1.
      # Protects against an entire AZ going down. Does not see node-level colocation —
      # that is what the podAntiAffinity above handles.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: checkout-service
      containers:
        - name: checkout-service
          image: your-registry/checkout-service:1.0.0
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NEW_RELIC_APP_NAME
              value: checkout-service-prod
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: newrelic-license
                  key: licenseKey
            - name: NEW_RELIC_DISTRIBUTED_TRACING_ENABLED
              value: "true"
            - name: NEW_RELIC_LOG_LEVEL
              value: info
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
