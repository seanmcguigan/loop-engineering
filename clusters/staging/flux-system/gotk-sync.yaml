apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: platform-loops
  namespace: flux-system
spec:
  interval: 1m
  url: ssh://git@github.com/your-org/platform-loops
  ref:
    branch: main
  secretRef:
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-staging
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/staging
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: platform-loops
